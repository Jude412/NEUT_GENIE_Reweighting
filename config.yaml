inputs:
  original_dir: "/vols/dune/jmm224/t2knova/reweighting/NEUT_file_tree"
  original_tree: "T2KNOvATruthTree"
  target_dir: "/vols/dune/jmm224/t2knova/reweighting/GENIE_file_tree"
  target_tree: "T2KNOvATruthTree"
  # All branches read for calculation of analysis parameters
  branches: ["Enu_true", "ELep", "PLep", "CosLep", "Eav", "Q2", "q0", "q3", "W_nuc_rest", "y", "PDGnu", "Mode", "cc", "nfsp", "px", "py", "pz", "E", "pdg", "px", "py", "pz", "PDGLep"]

analysis:
  modes: 
    - 1
    - 2
    - 11
    - 12
    - 13
    - 16
    - 17
    - 21
    - 22
    - 23
    - 26
    - 31
    - 32
    - 33
    - 34
    - 36
    - 38
    - 39
    - 41
    - 42
    - 43
    - 44
    - 45
    - 46
    - 51
    - 52

    #choose in 1, 2, 11, 12, 13, 16, 17, 21, 22, 23, 26, 31, 32, 33, 34, 36, 38, 39, 41, 42, 43, 44, 45, 46, 51 and 52

  modes_v2:
    - 0
    # - 1
    # - 2 
    # - 3
    # - 4
    # - 5
    # - 6
    # - 7

  #choose in 0, 1, 2, 3, 4, 5, 6 and 7 (0 for CC0pi, 1 for CC1pipm, 2 for CC1pi0, 3 for CCNpi, 4 for CCgamma, 5 for CCOther, 6 for NCInc, 7 for rest (should be nothing here))


  neutrino_PDG: 14
  train_percentage: 0.4
  val_percentage: 0.4

parameters:
  reweighting: # parameters to train the reweighting models on
    - Enu_true
    - PLep
    - CosLep
    - Eav
    - W
    - PTlep
  
  # parameters to compute the metrics on (along with the reweighting parameters)
  all: ["Enu_true", "PLep", "CosLep", "Q2", "q0", "q3", "PTlep", "Eav",
        "W", "y", "Mode", "Mode_v2", "cc", "N_n", "K_n", 
        "N_p", "K_p", "N_pi0", "K_pi0", "N_pip", "K_pip", "N_pim", "K_pim"]
  8D: ["Enu_true", "PLep", "CosLep", "Q2", "q0", "q3", "PTlep", "Eav"]
  3D: ["Enu_true", "PLep", "CosLep"]

  binning_file: "/vols/dune/jmm224/t2knova/reweighting/binnings.json"


models:
  model_list:
    # - binning
    # - NN
    # - GBR
    - XGB
  # choose from binning, NN, GBR (HEP_ML) and XGB (XGBoost)
  
  number_model_hyperparameters_sets:
    binning: 24
    NN: 240
    GBR: 270
    # XGB : 1
    XGB : 96
    

dimensions:
  dim: 6
  # In case of 3 or 8 dimensions, add an extra string (ex: "_custom") to dim, to rule out the degeneracy with the regular 3D and 8D cases (always computed for metrics).

swd_bootstrapping:
  # runs: 100
  # n_directions: 100
  runs: 200
  n_directions: 500

output:
  tag: "200k_files_CC0pi"
