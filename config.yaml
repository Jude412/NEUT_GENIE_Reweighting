inputs:
  # original_dir: "/vols/dune/jmm224/t2knova/reweighting/NEUT_test"
  original_dir: "/work4/ppd/scarf1585/t2knova/reweight/full_prod_2/GENIE"
  original_tree: "T2KNOvATruthTree"
  # target_dir: "/vols/dune/jmm224/t2knova/reweighting/GENIE_test"
  target_dir: "/work4/ppd/scarf1585/t2knova/reweight/full_prod_2/NEUT"
  target_tree: "T2KNOvATruthTree"

analysis:
  modes: ~
    #choose from 1, 2, 11, 12, 13, 16, 17, 21, 22, 23, 26, 31, 32, 33, 34, 36, 38, 39, 41, 42, 43, 44, 45, 46, 51 and 52

  topologies:
    - CC0pi
    - CC1pipm
    - CC1pi0
    - CCNpi
    - CCOther
    - NC0pi
    - NC1pipm
    - NC1pi0
    - NCNpi
    - NCOther
    # - Other

  #choose from CC0pi, CC1pipm, CC1pi0, CCNpi, CCgamma, CCOther, NCInc and rest (rest should be empty)
  #a separate training is run for each listed topology

  train_percentage: 0.4
  val_percentage: 0.4

  # Optional fraction of each input file's events to read in (between 0 and 1)
  downsampling: ~

  # Optional cap on the number of events trained (and validated) on per topology, as a multiple of
  # the topology's data size: the number of events the real downstream analysis will use for the
  # sample (Constants.DATA_N_EVENTS), split across its topologies by their target rates. The cap
  # applies to the larger of the original and target samples, the other being scaled by the same
  # fraction. Unset (~) trains on every event.
  max_training_events_factor: 5

parameters:
  # parameters to train the reweighting models on
  # reweighting: ["Enu_true", "PLep", "CosLep", "q0", "q3", "Q2", "W", "N_pi", "N_pi0", "N_pip", "N_pim", "N_thresh_p", "y", "Eav", "PTlep"]
  # reweighting: ["Enu_true", "PLep", "CosLep", "PTlep", "Eav"]
  reweighting: ["Enu_true", "PLep", "CosLep", "PTlep", "Eav", "q0", "q3", "W"]

  # Sets of parameters the metrics are computed on, each named by its key. Samples, bootstrapped
  # SWD distributions and metrics are produced for every set listed here.
  # The set of reweighting parameters is always added to them.
  metric_sets:
    # Fitting variables, possible reweighting variables, possible selection variables (for nova and t2k).
    # 8D: ["Enu_true", "PLep", "CosLep", "Q2", "q0", "q3", "PTlep", "Eav"]
    # 3D: ["Enu_true", "PLep", "CosLep"]
    NIWG: ["Enu_true", "PLep", "CosLep", "q0", "q3", "Q2", "W", "N_pi"]
    Sel: ["N_pi0", "N_pip", "N_pim", "N_thresh_p", "y"]
    NIWG_Sel_RW: ["Enu_true", "PLep", "CosLep", "q0", "q3", "Q2", "W", "N_pi", "N_pi0", "N_pip", "N_pim", "N_thresh_p", "y", "Eav", "PTlep"]

  # parameters to plot distributions of (in addition to all parameters listed in other sets)
  extra: []

  binning_file: "/vols/dune/jmm224/t2knova/reweighting/binnings.json"

models:
  model_list:
    # - binning
    - XGB
    # - unnormXGB
  # choose from binning, XGB (XGBoost), unnormXGB (XGB without normalised training classes)

  # Json file holding the hyperparameter grid every model is fine-tuned over
  grid_file: "hyperparameter_grids_single.json"

  # Optional json file of grid points to leave out of the fine-tuning, as
  # {sample: {topology: {model: [hp_id, ...]}}}: they are neither trained nor considered when the
  # best hyperparameter set is picked. A sample or topology given as "*" applies to all of them.
  # Unset (~) runs the whole grid.
  excluded_hps_file: ~

  # Metric the best hyperparameter set of every model is picked with, and whether it is
  # minimised ("min") or maximised ("max"). The metrics are named after the parameter sets
  # above (ex: SWD_3D, data_p_value_8D, chi2_dof_all, data_chi2_dof_all).
  selection_metric:
    binning:
      metric: SWD_reweighting
      direction: min
    XGB:
      metric: SWD_reweighting
      direction: min
    unnormXGB:
      metric: SWD_reweighting
      direction: min

swd_bootstrapping:
  #   runs x n_samples   the total number of bootstrap samples drawn, i.e. the statistics.
  #   runs               how many separate jobs that total is split into, and so how much
  #                      of it can run in parallel on the batch system.
  #   n_directions       the number of random projections each bootstrap sample is
  #                      evaluated on. Multiplies the cost of every job, without changing
  #                      how many jobs there are.

  runs: 5
  n_samples: 200
  n_directions: 500
  # runs: 1
  # n_samples: 5
  # n_directions: 50

data_scale:
  # The metrics prefixed 'data_' are computed at the number of events the real downstream analysis
  # will use (Constants.DATA_N_EVENTS, split across topologies by their target rate), rather than on
  # the full test sample. The SWD bootstrap above is drawn at that size too.
  #   n_subsamples       the number of data-sized subsamples of the original and target test samples
  #                      the data-scale SWD (mean) and p-value (median) of every run are taken over.
  n_subsamples: 15

output:
  tag: "complete_1_q0q3W"
