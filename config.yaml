inputs:
  # original_dir: "/vols/dune/jmm224/t2knova/reweighting/NEUT_file_tree"
  original_dir: "/vols/dune/jmm224/t2knova/reweighting/NEUT_test"
  original_tree: "T2KNOvATruthTree"
  # target_dir: "/vols/dune/jmm224/t2knova/reweighting/GENIE_file_tree"
  target_dir: "/vols/dune/jmm224/t2knova/reweighting/GENIE_test"
  target_tree: "T2KNOvATruthTree"
  # All branches read for calculation of analysis parameters
  branches: ["Enu_true", "ELep", "PLep", "CosLep", "Eav", "Q2", "q0", "q3", "W_nuc_rest", "y", "PDGnu", "Mode", "cc", "nfsp", "px", "py", "pz", "E", "pdg", "px", "py", "pz", "PDGLep", "fScaleFactor", "RWWeight"]

analysis:
  modes: 
    - 1
    - 2
    - 11
    - 12
    - 13
    - 16
    - 17
    - 21
    - 22
    - 23
    - 26
    - 31
    - 32
    - 33
    - 34
    - 36
    - 38
    - 39
    - 41
    - 42
    - 43
    - 44
    - 45
    - 46
    - 51
    - 52

    #choose in 1, 2, 11, 12, 13, 16, 17, 21, 22, 23, 26, 31, 32, 33, 34, 36, 38, 39, 41, 42, 43, 44, 45, 46, 51 and 52

  topologies:
    - CC0pi
    - CC1pipm
    - CC1pi0
    - CCNpi
    - CCOther
    - NC0pi
    - NC1pipm
    - NC1pi0
    - NCNpi
    - NCOther
    # - Other

  #choose in CC0pi, CC1pipm, CC1pi0, CCNpi, CCgamma, CCOther, NCInc and rest (rest should be empty)
  #a separate training is run for each listed topology


  neutrino_PDG: 14
  train_percentage: 0.4
  val_percentage: 0.4

parameters:
  reweighting: # parameters to train the reweighting models on
    - Enu_true
    - PLep
    - CosLep
    - Eav
    - W
    - PTlep
  
  # parameters to compute the metrics on (along with the reweighting parameters)
  all: ["Enu_true", "PLep", "CosLep", "Q2", "q0", "q3", "PTlep", "Eav",
        "W", "y", "Mode", "Topology", "cc", "N_n", "K_n", 
        "N_p", "K_p", "N_pi0", "K_pi0", "N_pip", "K_pip", "N_pim", "K_pim"]

  # Sets of parameters the metrics are computed on, each named by its key. Samples, bootstrapped
  # SWD distributions and metrics are produced for every set listed here, so adding a set is a
  # config file change: every parameter of a set must also be listed in the "all" section above.
  # The "all" set itself and the set of reweighting parameters are always added to them.
  metric_sets:
    8D: ["Enu_true", "PLep", "CosLep", "Q2", "q0", "q3", "PTlep", "Eav"]
    3D: ["Enu_true", "PLep", "CosLep"]

  binning_file: "/vols/dune/jmm224/t2knova/reweighting/binnings.json"


models:
  model_list:
    - binning
    - XGB
  # choose from binning and XGB (XGBoost)

  # Json file holding the hyperparameter grid every model is fine-tuned over. The number of
  # fine-tuning runs of a model is the size of its grid, so it never has to be given here.
  grid_file: "hyperparameter_grids.json"

  # Metric the best hyperparameter set of every model is picked with, and whether it is
  # minimised ("min") or maximised ("max"). The metrics are named after the parameter sets
  # above (ex: SWD_3D, p_value_8D, chi2_dof_all).
  selection_metric:
    binning:
      metric: SWD_3D
      direction: min
    XGB:
      metric: p_value_8D
      direction: max

dimensions:
  dim: 6
  # In case of 3 or 8 dimensions, add an extra string (ex: "_custom") to dim, to rule out the degeneracy with the regular 3D and 8D cases (always computed for metrics).

swd_bootstrapping:
  # runs: 100
  # n_directions: 100
  runs: 200
  n_directions: 500

output:
  tag: "testing_preweights2"
